[project]
name = "tryout"
version = "0.0.0"
description = "Run tasks across AI models, compare them, and keep the evidence."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=84.2.1"]
